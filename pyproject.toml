
# Cache bypass commit for Railway deployment 2026

[project]
name = "smart-city-cluj-napoca"
version = "0.1.0"
description = "Portfolio-grade Python application combining IoT telemetry, real-time urban monitoring, ML, and LLMs."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "streamlit>=1.35",
    "streamlit-authenticator",
    "streamlit-autorefresh",
    "streamlit-folium",
    "pandas>=2.3",
    "numpy>=2.0",
    "plotly>=6.0",
    "folium>=0.20",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "sqlalchemy>=2.0",
    "alembic>=1.19",
    "aiosqlite>=0.22",
    "scikit-learn>=1.8",
    "scipy>=1.17",
    "statsmodels>=0.14",
    "prophet>=1.3",
    "fastapi>=0.135",
    "uvicorn[standard]>=0.42",
    "python-multipart>=0.0.27",
    "groq>=1.6",
    "google-genai>=1.73",
    "httpx>=0.28",
    "requests>=2.33",
    "aiohttp",
    "aiohttp-retry>=2.9",
    "python-dotenv>=1.2",
    "pydantic>=2.12",
    "pydantic-settings>=2.0",
    "reportlab>=5.0",
    "xlsxwriter>=3.2",
    "pyjwt>=2.13",
    "cryptography>=47.0",
    "gitpython>=3.1"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0"
]

[tool.uv]
managed = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ai_tests", "app", "src"]
python_files = ["test_*.py", "*_test.py"]
